      <stop offset="0.55" stop-color="#DDF4FF"/>
      <stop offset="1" stop-color="#BDE9FF"/>
    </linearGradient>
    <linearGradient id="bubbleBase" x1="300" y1="260" x2="760" y2="820" gradientUnits="userSpaceOnUse">
