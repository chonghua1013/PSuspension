  <rect width="1024" height="1024" rx="236" fill="url(#tile)"/>
  <path d="M178 176C230 120 315 92 430 92h164c154 0 259 36 315 108 31 39 43 86 43 154v244c0 144-54 250-162 318-61 38-142 57-244 57H378c-81 0-148-14-201-43C99 889 60 819 60 720V330c0-63 39-118 118-154z" fill="#FFFFFF" opacity="0.12"/>

